<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨后影视社 | Rain After Film</title>
<style>
:root{
  --bg:#0b0e1c; --card:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.10); --gold:#f3d67b; --gold2:#c89b3c;
  --cy:#4fd8d4; --vi:#8b7cf6; --tx:#e8ecf7; --tx2:#9aa3c0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
canvas#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:2}
a{text-decoration:none;color:inherit}

nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:16px 5vw;display:flex;align-items:center;gap:16px;background:rgba(11,14,28,.55);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:1px}
.logo .lg{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--vi));display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(243,214,123,.5);flex:none}
.logo .lg svg{width:24px;height:24px;fill:#241a00}
.logo span em{color:var(--gold);font-style:normal}
.nav-r{margin-left:auto;display:flex;gap:26px;font-size:15px;color:var(--tx2);flex-wrap:wrap}
.nav-r a:hover{color:var(--gold)}

.hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 5vw;position:relative}
.hero .kicker{letter-spacing:6px;color:var(--cy);text-transform:uppercase;font-size:14px;margin-bottom:18px;opacity:.9}
.hero h1{font-size:clamp(46px,9vw,110px);font-weight:800;line-height:1.05;letter-spacing:2px;margin-bottom:22px;background:linear-gradient(100deg,#fff,#f3d67b 55%,#8b7cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:clamp(15px,2.2vw,20px);color:var(--tx2);max-width:720px;line-height:1.8;margin-bottom:40px}
.hero .sub b{color:var(--gold);font-weight:600}
.btn-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 34px;border-radius:40px;font-size:16px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.3s}
.btn.gold{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#241a00;box-shadow:0 8px 28px rgba(200,155,60,.35)}
.btn.ghost{border-color:var(--line);color:var(--tx);background:var(--card);backdrop-filter:blur(6px)}
.btn:hover{transform:translateY(-3px)}

section{padding:90px 6vw;position:relative}
.sec-tag{color:var(--gold);letter-spacing:4px;font-size:13px;text-transform:uppercase;margin-bottom:8px}
.sec-h{font-size:clamp(30px,5vw,46px);font-weight:800;margin-bottom:14px}
.sec-p{color:var(--tx2);max-width:660px;line-height:1.75;margin-bottom:40px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.card{background:linear-gradient(160deg,var(--card),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;padding:30px;transition:.35s;backdrop-filter:blur(8px)}
.card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 20px 50px rgba(139,124,246,.16)}
.card .ic{font-size:34px;margin-bottom:16px}
.card h3{font-size:20px;margin-bottom:10px}
.card p{color:var(--tx2);font-size:14px;line-height:1.7}

.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
@media(max-width:900px){.mod-grid{grid-template-columns:1fr}}
.mod{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:26px;padding:30px;backdrop-filter:blur(10px)}
.mod h3{font-size:22px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.mod .m-sub{color:var(--tx2);font-size:13px;margin-bottom:22px}
.sbar{display:flex;gap:12px;margin-bottom:18px}
.sbar input{flex:1;padding:14px 20px;border-radius:40px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);font-size:15px;outline:none;transition:.3s}
.sbar input:focus{border-color:var(--gold)}
.sbar button{padding:0 26px;border-radius:40px;border:none;background:linear-gradient(120deg,var(--cy),var(--vi));color:#04121a;font-weight:700;font-size:15px;cursor:pointer;transition:.3s}
.sbar button:hover{filter:brightness(1.1)}
.hint{color:var(--tx2);font-size:12px;line-height:1.6;padding:14px;border:1px dashed var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.hint b{color:var(--gold)}

footer{border-top:1px solid var(--line);padding:50px 6vw;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;background:rgba(16,21,40,.4)}
footer .f-l{display:flex;align-items:center;gap:12px}
footer .lg{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--vi));display:flex;align-items:center;justify-content:center;flex:none}
footer .lg svg{width:22px;height:22px;fill:#241a00}
footer .f-r{color:var(--tx2);font-size:13px}
#toTop{position:fixed;right:26px;bottom:26px;z-index:60;width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px);color:var(--gold);font-size:20px;cursor:pointer;opacity:0;transition:.3s}
#toTop.show{opacity:1}
.lg img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}

/* 光影书架 */
const scol=['#c0392b','#d35400','#f39c12','#27ae60','#16a085','#2980b9','#8e44ad','#e84393','#2c3e50','#6c5ce7'];
function sEsc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function loadBooks(){try{return JSON.parse(localStorage.getItem('rainBooks')||'[]');}catch(e){return[];}}
function saveBooks(b){localStorage.setItem('rainBooks',JSON.stringify(b));}
function renderShelf(){const c=document.getElementById('shelfbooks');if(!c)return;const b=loadBooks();if(!b.length){c.innerHTML='<div style="color:#9aa3c0;align-self:center;">书架还空着，来放第一本书吧 ✨</div>';return;}c.innerHTML=b.map((x,i)=>'<div class="book" style="background:'+scol[i%scol.length]+'"><button class="del" onclick="delBook('+i+')">×</button><span class="bt">'+sEsc(x.name)+'</span><span class="ba">'+sEsc(x.author)+'</span></div>').join('');}
function addBook(){const n=document.getElementById('bname').value.trim();const a=document.getElementById('bauthor').value.trim();if(!n){document.getElementById('bname').focus();return;}const b=loadBooks();b.push({name:n,author:(a||'佚名')});saveBooks(b);renderShelf();document.getElementById('bname').value='';document.getElementById('bauthor').value='';}
function delBook(i){const b=loadBooks();b.splice(i,1);saveBooks(b);renderShelf();}
renderShelf();
  document.getElementById('bname').value='';document.getElementById('bauthor').value='';
}
function delBook(i){const b=loadBooks();b.splice(i,1);saveBooks(b);renderShelf();}
renderShelf();

</script>
</body>
</html>
